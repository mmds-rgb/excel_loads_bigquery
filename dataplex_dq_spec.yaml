# Dataplex Auto Data Quality Spec for test_daily_loads table
# Reference: https://cloud.google.com/dataplex/docs/use-auto-data-quality

rules:
  # =========================================================================
  # Rule 1: Dynamic Missing Date Check (sqlAssertion)
  # =========================================================================
  # How it works:
  # 1. GENERATE_DATE_ARRAY: Generates a list of all calendar dates from the 
  #    last 30 days up to yesterday (excluding today to prevent false alarms on 
  #    in-progress loads).
  # 2. LEFT JOIN: Matches the list of expected dates against actual dates in 
  #    the target table (${data()}).
  # 3. WHERE ... IS NULL: Filters for expected dates that have no matching rows 
  #    in the target table.
  # 4. sqlAssertion: A SQL assertion check fails if any row is returned. Therefore, 
  #    if any expected dates are missing, they are returned as rows and the rule fails.
  - name: all-data-loaded-dynamic
    description: "Fails if any load_date is missing from the last 30 days"
    dimension: COMPLETENESS
    sqlAssertion:
      sqlStatement: |
        SELECT expected_date 
        FROM UNNEST(
          GENERATE_DATE_ARRAY(
            DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY), 
            DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          )
        ) AS expected_date 
        LEFT JOIN ( 
          SELECT DISTINCT load_date 
          FROM ${data()} 
        ) AS actual_table 
          ON expected_date = actual_table.load_date 
        WHERE actual_table.load_date IS NULL

  # =========================================================================
  # Rule 2: Single-date Completeness Check (tableConditionExpectation)
  # =========================================================================
  # How it works:
  # 1. COUNTIF: Evaluates if load_date matches yesterday's date, counting rows.
  # 2. > 0: Validates that at least 1 row exists for yesterday.
  # 3. tableConditionExpectation: A boolean expression evaluated over the table. 
  #    Must evaluate to true for the check to pass. Fails if count is 0.
  - name: check-yesterday-load-exists
    description: "Ensures yesterday's load_date is present in the table"
    dimension: COMPLETENESS
    tableConditionExpectation:
      sqlExpression: "COUNTIF(load_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)) > 0"

  # =========================================================================
  # Rule 3: Anomaly Detection on Ingested Rows Volume (tableConditionExpectation)
  # =========================================================================
  # How it works:
  # 1. historical: Subquery aggregates daily volume (count of transactions) for 
  #    each day over the last 30 days (excluding yesterday/today), and calculates 
  #    the historical average volume (avg_vol) and standard deviation (stddev_vol).
  # 2. yesterday: Subquery counts the total transactions ingested yesterday.
  # 3. BETWEEN: Checks if yesterday's count falls within a standard 3-standard-deviation 
  #    confidence interval [avg_vol - 3*stddev, avg_vol + 3*stddev].
  # 4. tableConditionExpectation: Fails if yesterday's volume is outside the normal 
  #    variation range, signaling a potential data leak or duplication.
  - name: check-yesterday-volume-anomaly
    description: "Fails if yesterday's row count is a statistical anomaly (outside 3 stddevs of 30-day average)"
    dimension: volume
    tableConditionExpectation:
      sqlExpression: |
        (
          SELECT
            yesterday.row_count BETWEEN (avg_vol - 3 * stddev_vol) AND (avg_vol + 3 * stddev_vol)
          FROM (
            SELECT
              AVG(daily_vol) AS avg_vol,
              STDDEV(daily_vol) AS stddev_vol
            FROM (
              SELECT load_date, COUNT(1) AS daily_vol
              FROM ${data()}
              WHERE load_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
                AND load_date < DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
              GROUP BY load_date
            )
          ) historical
          CROSS JOIN (
            SELECT COUNT(1) AS row_count
            FROM ${data()}
            WHERE load_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          ) yesterday
        )
